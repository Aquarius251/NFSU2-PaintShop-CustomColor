[CustomColor]
; 1 = on, 0 = the whole mod is off (game colours only, nothing is hooked)
Enabled=1
; key that opens / closes the colour picker anywhere (F1..F24 or 0x.. virtual key code)
PickerKey=F4
; 1 = paint, rims, calipers, parts and vinyls can have any colour
Paint=1
; 1 = paints can get their own shine colour (edges / glancing angles) with an amount slider 0-200 %
Shine=1
; 1 = decals can have any colour, each decal spot its own
DecalColours=1
; 1 = picture vinyls (Art Factory / Contest / Unique) can get a colour of their own (Custom color, presets; Default = as drawn)
VinylTintPictures=1
; 1 = shop screens get a "Custom color" button
ShopButton=1
; 1 = K / L turn the car in the shops (hold; Shift = faster)
TurnKeys=1
; 1 = custom rim colour also on the far-away rim models while driving
RimLodFix=1
; brightness of custom-coloured parts (rims, calipers, spoiler...): higher = brighter, closer to the swatch
PartBrightness=1.35
; menus: 0 = detect (WidescreenFix with FixHUD=1 = centred 4:3 menus, otherwise stretched), 1 = centred, 2 = stretched
MenuLayout=0
; memory for the coloured copies of HD texture packs, in MB. When full, the oldest unused copies are freed first.
VinylTintMemoryMB=160
DecalTintMemoryMB=192
; where the colours are saved (per car and part; next to this file unless a full path is given)
File=NFSU2_CustomColor.txt
; 1 = write NFSU2_CustomColor.log next to this file (for bug reports)
Log=0
